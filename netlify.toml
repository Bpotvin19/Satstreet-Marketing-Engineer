# Netlify build settings for the public site.

[build]
  publish = "public"
  # Pre-render the Notion-backed Resource Centre into static JSON before each
  # deploy. This keeps Notion as the editorial source of truth while making the
  # client experience load from Netlify's CDN instead of waiting on Notion.
  command = "node scripts/build-resource-cache.mjs"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/ticker.html"
  status = 200

[[headers]]
  for = "/data/resources/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
